<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORGE Signal Backtester</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="header">
    <h1>FORGE Signal Backtester</h1>
    <span class="header-sub">Signal x Exit Strategy Matrix for APEX</span>
</div>

<nav class="nav">
    <button class="active" data-view="consistency">Consistency</button>
    <button data-view="matrix">Matrix</button>
    <button data-view="signals">Signal Accuracy</button>
    <button data-view="detail" id="detail-tab" style="display:none">Detail</button>
    <button data-view="results">All Results</button>
    <button data-view="mytrades">My Trades</button>
</nav>

<!-- View 0: Cross-Timeframe Consistency -->
<div id="view-consistency" class="view active">
    <div id="consistency-content"></div>
</div>

<!-- View 1: Matrix Heatmap -->
<div id="view-matrix" class="view">
    <div class="controls">
        <label>Metric: <select id="matrix-metric">
            <option value="totalReturn">Total Return %</option>
            <option value="winRate">Win Rate %</option>
            <option value="sharpe">Sharpe Ratio</option>
            <option value="profitFactor">Profit Factor</option>
            <option value="maxDrawdown">Max Drawdown %</option>
        </select></label>
    </div>
    <div id="matrix-content"></div>
</div>

<!-- View 2: Signal Accuracy -->
<div id="view-signals" class="view">
    <div id="signals-content"></div>
</div>

<!-- View 3: Strategy Detail -->
<div id="view-detail" class="view">
    <button class="back-btn" onclick="showView('matrix')">&larr; Back</button>
    <div id="detail-content"></div>
</div>

<!-- View 4: All Results -->
<div id="view-results" class="view">
    <div id="results-list"></div>
</div>

<!-- View 5: My Trades -->
<div id="view-mytrades" class="view">
    <div id="mytrades-content"></div>
</div>

<script src="/js/app.js"></script>

</body>
</html>
